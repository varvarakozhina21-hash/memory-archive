<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORY_ARCHIVE</title>

<style>

body{
margin:0;
background:black;
color:#00ff88;
font-family:monospace;
overflow-x:hidden;
}

.scanline{
position:fixed;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,255,136,.05) 3px
);
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
border:1px solid #00ff88;
}

.glitch{
animation:glitch 1s infinite;
}

@keyframes glitch{
0%{text-shadow:2px 0 red,-2px 0 blue;}
50%{text-shadow:-2px 0 red,2px 0 blue;}
100%{text-shadow:2px 0 red,-2px 0 blue;}
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
background:black;
border:1px solid #00ff88;
color:#00ff88;
font-family:monospace;
}

button{
cursor:pointer;
}

#terminal{
margin-top:20px;
white-space:pre-wrap;
min-height:250px;
}

</style>
</head>

<body>

<div class="scanline"></div>

<div class="container">

<h1 class="glitch">
MEMORY_ARCHIVE // CORE NODE
</h1>

<p id="status">
> SYSTEM INITIALIZING...
</p>

<input id="cmd" placeholder="enter command">
<button onclick="run()">EXECUTE</button>

<div id="terminal"></div>

</div>

<script>

const terminal=document.getElementById("terminal");
const status=document.getElementById("status");
  
  const input=document.getElementById("cmd");

input.addEventListener("keydown", function(e){
if(e.key==="Enter"){
run();
}
});

let holesFound={
sector_07:false,
sector_13:false,
sector_19:false
};

function write(text){

terminal.innerHTML += "> " + text + "\n";
terminal.scrollTop = terminal.scrollHeight;

}

function getProgress(){

let found=0;

if(holesFound.sector_07) found++;
if(holesFound.sector_13) found++;
if(holesFound.sector_19) found++;

return Math.floor(found/3*100);

}

function run(){

const input=document.getElementById("cmd");
const v=input.value.trim().toLowerCase();

input.value="";

write("> "+v);

if(v==="help"){

write("AVAILABLE COMMANDS:");
write("logs");
write("scan");
write("status");
write("sector_##");
write("???");

}

else if(v==="logs"){

write("Loading memory logs...");
write("19 sectors detected");

}

else if(v==="scan"){

write("Scanning memory...");
write("Anomalies detected: 3");

}

else if(v==="status"){

write("System status: ONLINE");
write("Memory integrity: 73%");

}

else if(v.startsWith("sector_")){

if(v==="sector_07"){

holesFound.sector_07=true;

write("Scanning sector...");
write("Аномалия обнаружена");
write("Восстановлен скрытый фрагмент памяти");

}

else if(v==="sector_13"){

holesFound.sector_13=true;

write("Scanning sector...");
write("Аномалия обнаружена");
write("Обнаружен повреждённый след");

}

else if(v==="sector_19"){

holesFound.sector_19=true;

write("Scanning sector...");
write("Аномалия обнаружена");
write("Найден последний скрытый фрагмент");

}

else{

write("Scanning sector...");
write("Status: OK");
write("Integrity: 100%");
write("No anomalies detected");

}

}

else if(v==="core"){

let p=getProgress();

if(p<100){

write("CORE LOCKED");
write("Recovery progress: "+p+"%");
return;

}

write("CORE MEMORY UNLOCKED");
write("");
write("ПРОВЕРКА ЗАВЕРШЕНА...");
write("АНАЛИЗ ОБЪЕКТА...");
write("");
write("Система: классификация завершена");
write("Статус: объект не является стандартным пользователем");
write("Уровень значимости: высокий");
write("");
write("С днём рождения ❤️");
write("Система зафиксировала тебя в памяти.");

}

else{

write("UNKNOWN COMMAND");

}

}

setTimeout(()=>{

status.innerText="> CORE NODE ONLINE";

},1200);

</script>

</body>
</html>
