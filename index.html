<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORY_ARCHIVE</title>

<style>
body{
margin:0;
background:#05070d;
color:#7aa7ff;
font-family:monospace;
overflow:hidden;
}

.scanline{
position:fixed;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(122,167,255,.05) 3px
);
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
border:1px solid rgba(122,167,255,.4);
background:rgba(10,14,25,.6);
backdrop-filter: blur(6px);
box-shadow:0 0 30px rgba(122,167,255,.08);
}

.glitch{
animation:glitch 1.2s infinite;
color:#9bc2ff;
}

@keyframes glitch{
0%{text-shadow:2px 0 #ff4d6d,-2px 0 #4dd2ff;}
50%{text-shadow:-2px 0 #ff4d6d,2px 0 #4dd2ff;}
100%{text-shadow:2px 0 #ff4d6d,-2px 0 #4dd2ff;}
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
background:#0a0f1c;
border:1px solid rgba(122,167,255,.5);
color:#7aa7ff;
font-family:monospace;
}

button{
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#111a2e;
}

#terminal{
margin-top:20px;
white-space:pre-wrap;
height:300px;
overflow-y:auto;
border:1px solid rgba(122,167,255,.3);
padding:10px;
background:rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="scanline"></div>

<div class="container">

<h1 class="glitch">
MEMORY_ARCHIVE // CORE NODE
</h1>

<p id="status">
> SYSTEM INITIALIZING...
</p>

<input id="cmd" placeholder="enter command">
<button onclick="run()">EXECUTE</button>

<div id="terminal"></div>

</div>

<script>

const terminal=document.getElementById("terminal");
const status=document.getElementById("status");
  
  const input=document.getElementById("cmd");

input.addEventListener("keydown", function(e){
if(e.key==="Enter"){
run();
}
});

let holesFound={
sector_07:false,
sector_13:false,
sector_19:false
};

let queue = [];
let isWriting = false;

function write(text){
queue.push(text);
if(!isWriting){
processQueue();
}
}

function processQueue(){

if(queue.length === 0){
isWriting = false;
return;
}

isWriting = true;

let text = queue.shift();

let lines = text.split("\n");
let lineIndex = 0;

function printLine(){

if(lineIndex >= lines.length){
isWriting = false;
processQueue();
return;
}

let line = document.createElement("div");
terminal.appendChild(line);

let i = 0;

function typeChar(){

if(i < lines[lineIndex].length){
line.innerHTML += lines[lineIndex].charAt(i);
i++;
terminal.scrollTop = terminal.scrollHeight;
setTimeout(typeChar, 15);
}else{
lineIndex++;
setTimeout(printLine, 120);
}

}

typeChar();

}

printLine();

}
function getProgress(){

let found=0;

if(holesFound.sector_07) found++;
if(holesFound.sector_13) found++;
if(holesFound.sector_19) found++;

return Math.floor(found/3*100);

}

function run(){

const input=document.getElementById("cmd");
const v=input.value.trim().toLowerCase();

input.value="";

write("INPUT: "+v);

if(v==="help"){

write("AVAILABLE COMMANDS:");
write("logs");
write("scan");
write("status");
write("sector_##");
write("???");

}

else if(v==="logs"){

write("Loading memory logs...");
write("19 sectors detected");

}

else if(v==="scan"){

write("Scanning memory...");
write("Anomalies detected: 3");

}

else if(v==="status"){

write("System status: ONLINE");
write("Memory integrity: 73%");

}

else if(v.startsWith("sector_")){

if(v==="sector_07"){

holesFound.sector_07=true;

write("УЗЕЛ АКТИВЕН");
write("обнаружена аномалия");
write("фрагмент памяти восстановлен");
write("статус: нестабильный");

}

else if(v==="sector_13"){

holesFound.sector_13=true;

write("УЗЕЛ АКТИВЕН");
write("обнаружена аномалия");
write("фрагмент памяти восстановлен");
write("статус: нестабильный");

}

else if(v==="sector_19"){

holesFound.sector_19=true;

write("УЗЕЛ АКТИВЕН");
write("обнаружена аномалия");
write("фрагмент памяти восстановлен");
write("статус: нестабильный");

}

else{

write("Scanning sector...");
write("Status: OK");
write("Integrity: 100%");
write("No anomalies detected");

}

}


else if(v==="core"){

let p=getProgress();

write("CORE MEMORY CHECK...");
write("fragments found: "+p+"%");

if(p<100){
write("CORE LOCKED");
write("missing fragments detected");
return;
}

write("");
write("CORE MEMORY UNLOCKED");
write("INITIALIZING FINAL REPORT...");
write("");
write("Система: классификация завершена");
write("Статус: объект не является стандартным пользователем");
write("Уровень значимости: высокий");
write("");
write("С днём рождения ❤️");
write("Система зафиксировала тебя в памяти.");
write("");
write("SYSTEM LOG CLOSED");
write("SESSION TERMINATED");

}

else{
write("UNKNOWN COMMAND");
}

}

setTimeout(()=>{

status.innerText="> CORE NODE ONLINE";

},1200);

</script>

</body>
</html>
