<script>

const terminal=document.getElementById("terminal");
const status=document.getElementById("status");
const input=document.getElementById("cmd");

/* SOUND (простая имитация терминала) */
function beep(){
try{
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type="square";
osc.frequency.value=600;
gain.gain.value=0.03;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();
osc.stop(ctx.currentTime+0.05);
}catch(e){}
}

let holesFound={
sector_07:false,
sector_13:false,
sector_19:false
};

function write(text){

terminal.innerHTML+=text+"\n";
terminal.scrollTop=terminal.scrollHeight;

/* лёгкий “глитч шанс” */
if(Math.random()<0.08){
terminal.innerHTML+="\n[GLITCH DETECTED]\n";
}

}

function getProgress(){

let found=0;

if(holesFound.sector_07) found++;
if(holesFound.sector_13) found++;
if(holesFound.sector_19) found++;

return Math.floor(found/3*100);

}

/* ENTER */
input.addEventListener("keydown", function(e){
if(e.key==="Enter"){
run();
}
});

function run(){

beep();

const v=input.value.trim().toLowerCase();
input.value="";

write("> "+v);

/* HELP */
if(v==="help"){
write("AVAILABLE:");
write("logs / scan / status / sector_## / core / trace");
}

/* LOGS */
else if(v==="logs"){
write("[SYSTEM] loading archive...");
write("[MEMORY] 19 nodes detected");
}

/* SCAN */
else if(v==="scan"){
write("[SCAN] deep analysis running...");
write("[SCAN] anomalies: 3");
}

/* STATUS */
else if(v==="status"){
write("[SYSTEM] online");
write("[MEMORY] integrity stable");
}

/* TRACE (пасхалка) */
else if(v==="trace"){
write("[TRACE] searching hidden layer...");
write("...signal unstable");
write("user memory imprint detected");
write(">> connection unclear");
}

/* SECTORS */
else if(v.startsWith("sector_")){

if(v==="sector_07"){
holesFound.sector_07=true;
write("[NODE 07]");
write("anomaly detected");
write("memory fragment partially recovered");
write("...something feels familiar");
}

else if(v==="sector_13"){
holesFound.sector_13=true;
write("[NODE 13]");
write("corrupted signature found");
write("data reconstruction unstable");
write("signal resembles emotional trace");
}

else if(v==="sector_19"){
holesFound.sector_19=true;
write("[NODE 19]");
write("hidden fragment unlocked");
write("core proximity detected");
write("final trace acquired");
}

else{
write("[NODE] clean sector");
write("status: OK");
write("no anomalies detected");
}

}

/* CORE */
else if(v==="core"){

let p=getProgress();

if(p<100){
write("[CORE] locked");
write("reconstruction: "+p+"%");
write("missing fragments detected");
return;
}

/* ВАЖНО: твое послание НЕ ИЗМЕНЕНО */
write("[CORE] MEMORY UNLOCKED");
write("");
write("ПРОВЕРКА ЗАВЕРШЕНА...");
write("АНАЛИЗ ОБЪЕКТА...");
write("");
write("Система: классификация завершена");
write("Статус: объект не является стандартным пользователем");
write("Уровень значимости: высокий");
write("");
write("С днём рождения ❤️");
write("Система зафиксировала тебя в памяти.");

/* дополнительная атмосфера (не трогаю смысл) */
setTimeout(()=>{
write("");
write("[SYSTEM] connection terminated");
write("[SYSTEM] memory archive sealed");
},800);

}

/* UNKNOWN */
else{
write("[ERROR] unknown command");
}

}

/* старт */
setTimeout(()=>{
status.innerText="> CORE NODE ONLINE";
},1200);

</script>
